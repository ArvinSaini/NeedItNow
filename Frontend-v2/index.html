<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NeedItNow — borrow, lend, buy and sell within your hostel community." />
    <title>NeedItNow — Your Hostel's Sharing Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <style>
        .boot-splash {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .boot-splash div {
          height: 40px;
          width: 40px;
          border-radius: 9999px;
          border: 3px solid #f9e7b2;
          border-top-color: #d34e4e;
          animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="boot-splash" role="status" aria-label="Loading"><div></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
